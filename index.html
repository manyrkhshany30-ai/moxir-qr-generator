<script>
function makeQR(text,fm){
var T=[[1,26,16],[1,44,28],[1,70,44],[2,50,32],[2,67,43],[4,43,27],[4,49,31],[2,60,38,2,61,39],[3,58,36,2,59,37],[4,69,43,1,70,44],[1,80,50,4,81,51],[6,58,36,2,59,37],[8,59,37,1,60,38],[4,64,40,5,65,41]];
var s=unescape(encodeURIComponent(text)),d=[],i,j,k,v,b;
for(i=0;i<s.length;i++)d.push(s.charCodeAt(i));
var blocks;
for(v=1;v<=14;v++){
var r=T[v-1],dc=0;
for(i=0;i<r.length;i+=3)dc+=r[i]*r[i+2];
if(4+(v<10?8:16)+8*d.length<=8*dc)break;
}
if(v>14)throw new Error('long');
var r=T[v-1],dc=0;
for(i=0;i<r.length;i+=3)dc+=r[i]*r[i+2];
var bits=[];
function put(x,n){for(var q=n-1;q>=0;q--)bits.push((x>>q)&1);}
put(4,4);put(d.length,v<10?8:16);
for(i=0;i<d.length;i++)put(d[i],8);
for(i=0;i<4&&bits.length<8*dc;i++)bits.push(0);
while(bits.length%8)bits.push(0);
for(i=0xEC;bits.length<8*dc;i^=0xEC^0x11)put(i,8);
var cw=[];
for(i=0;i<bits.length;i+=8){var x=0;for(j=0;j<8;j++)x=x*2+bits[i+j];cw.push(x);}
function mul(x,y){var z=0;for(var q=7;q>=0;q--){z=(z<<1)^((z>>>7)*0x11D);z^=((y>>>q)&1)*x;}return z;}
function rs(data,n){
var g=[],q,w;
for(q=0;q<n-1;q++)g.push(0);g.push(1);
var root=1;
for(q=0;q<n;q++){for(w=0;w<g.length;w++){g[w]=mul(g[w],root);if(w+1<g.length)g[w]^=g[w+1];}root=mul(root,2);}
var res=[];for(q=0;q<n;q++)res.push(0);
data.forEach(function(bt){var f=bt^res.shift();res.push(0);for(var u=0;u<n;u++)res[u]^=mul(g[u],f);});
return res;
}
blocks=[];var pos=0;
for(i=0;i<r.length;i+=3){
for(j=0;j<r[i];j++){
var dat=cw.slice(pos,pos+r[i+2]);pos+=r[i+2];
blocks.push({d:dat,e:rs(dat,r[i+1]-r[i+2])});
}
}
var out=[],maxd=0;
blocks.forEach(function(bk){if(bk.d.length>maxd)maxd=bk.d.length;});
for(i=0;i<maxd;i++)blocks.forEach(function(bk){if(i<bk.d.length)out.push(bk.d[i]);});
for(i=0;i<blocks[0].e.length;i++)blocks.forEach(function(bk){out.push(bk.e[i]);});
var n=17+4*v,m=[],f=[];
for(i=0;i<n;i++){m.push([]);f.push([]);for(j=0;j<n;j++){m[i].push(0);f[i].push(0);}}
function sf(x,y,val){if(x>=0&&y>=0&&x<n&&y<n){m[y][x]=val?1:0;f[y][x]=1;}}
for(i=0;i<n;i++){sf(6,i,i%2==0);sf(i,6,i%2==0);}
function finder(cx,cy){for(var dy=-4;dy<=4;dy++)for(var dx=-4;dx<=4;dx++){var ds=Math.max(Math.abs(dx),Math.abs(dy));sf(cx+dx,cy+dy,ds!=2&&ds!=4);}}
finder(3,3);finder(n-4,3);finder(3,n-4);
var na=v==1?0:Math.floor(v/7)+2,al=[];
if(na){
var last=n-7,step=Math.ceil((last-6)/(na-1)/2)*2;
al=[6];for(i=na-2;i>=0;i--)al.push(last-step*i);
}
for(i=0;i<al.length;i++)for(j=0;j<al.length;j++){
if((i==0&&j==0)||(i==0&&j==al.length-1)||(i==al.length-1&&j==0))continue;
for(var dy=-2;dy<=2;dy++)for(var dx=-2;dx<=2;dx++)sf(al[i]+dx,al[j]+dy,Math.max(Math.abs(dx),Math.abs(dy))!=1);
}
function fmt(mask){
var dd=mask,rem=dd;
for(var q=0;q<10;q++)rem=(rem<<1)^((rem>>>9)*0x537);
var bt=((dd<<10)|rem)^0x5412;
function g(q){return (bt>>>q)&1;}
for(var q=0;q<=5;q++)sf(8,q,g(q));
sf(8,7,g(6));sf(8,8,g(7));sf(7,8,g(8));
for(var q=9;q<15;q++)sf(14-q,8,g(q));
for(var q=0;q<8;q++)sf(n-1-q,8,g(q));
for(var q=8;q<15;q++)sf(8,n-15+q,g(q));
sf(8,n-8,1);
}
fmt(0);
if(v>=7){
var rem=v;for(i=0;i<12;i++)rem=(rem<<1)^((rem>>>11)*0x1F25);
var vb=(v<<12)|rem;
for(i=0;i<18;i++){var bt=(vb>>>i)&1,a=n-11+i%3,c=Math.floor(i/3);sf(a,c,bt);sf(c,a,bt);}
}
var idx=0;
for(var right=n-1;right>=1;right-=2){
if(right==6)right=5;
for(var vert=0;vert<n;vert++)for(j=0;j<2;j++){
var x=right-j,up=((right+1)&2)==0,y=up?n-1-vert:vert;
if(!f[y][x]&&idx<out.length*8){m[y][x]=(out[idx>>>3]>>>(7-(idx&7)))&1;idx++;}
}
}
function mask(k){
for(var y=0;y<n;y++)for(var x=0;x<n;x++){
if(f[y][x])continue;
var t;
switch(k){
case 0:t=(x+y)%2==0;break;
case 1:t=y%2==0;break;
case 2:t=x%3==0;break;
case 3:t=(x+y)%3==0;break;
case 4:t=(Math.floor(x/3)+Math.floor(y/2))%2==0;break;
case 5:t=x*y%2+x*y%3==0;break;
case 6:t=(x*y%2+x*y%3)%2==0;break;
default:t=((x+y)%2+x*y%3)%2==0;
}
if(t)m[y][x]^=1;
}
}
function pen(){
var p=0,y,x,run;
for(y=0;y<n;y++){
run=1;for(x=1;x<n;x++){if(m[y][x]==m[y][x-1]){run++;if(run==5)p+=3;else if(run>5)p++;}else run=1;}
}
for(x=0;x<n;x++){
run=1;for(y=1;y<n;y++){if(m[y][x]==m[y-1][x]){run++;if(run==5)p+=3;else if(run>5)p++;}else run=1;}
}
for(y=0;y<n-1;y++)for(x=0;x<n-1;x++){var c=m[y][x];if(c==m[y][x+1]&&c==m[y+1][x]&&c==m[y+1][x+1])p+=3;}
return p;
}
var best=0,bp=1e9;
for(i=0;i<8;i++){mask(i);fmt(i);var p=pen();if(p<bp){bp=p;best=i;}mask(i);}
if(fm!==undefined)best=fm;
mask(best);fmt(best);
return {n:n,m:m};
}
(function(){
var $=function(i){return document.getElementById(i)};
var txt=$('txt'),out=$('out'),emp=$('empty'),msg=$('msg'),dl=$('dl'),dg=$('d'),tm,svg='',lq=null;
function say(t,e){msg.textContent=t||'';msg.style.fontWeight=e?'800':'400';}
function ds(s){dg.textContent='وضعیت: '+s;}
ds('جاوااسکریپت ✓');
window.onerror=function(m){say('خطا: '+m,1);ds('خطا: '+m);};
function none(){out.style.display='none';emp.style.display='block';dl.disabled=true;svg='';lq=null;}
function make(){
var t=txt.value.trim();
if(!t){none();say('');return;}
var q;
try{q=makeQR(t);}catch(e){none();say('متن خیلی طولانی است. کوتاه‌ترش کن.',1);return;}
var n=q.n,z=n+8,d='',x,y;
for(y=0;y<n;y++)for(x=0;x<n;x++)if(q.m[y][x])d+='M'+(x+4)+' '+(y+4)+'h1v1h-1z';
svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+z+' '+z+'" shape-rendering="crispEdges"><rect width="'+z+'" height="'+z+'" fill="#fff"/><path d="'+d+'"/></svg>';
lq=q;
out.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
out.style.display='block';emp.style.display='none';dl.disabled=false;
say('آماده است. با دوربین گوشی دیگر اسکنش کن.');
ds('جاوااسکریپت ✓ | QR ✓');
}
function later(){clearTimeout(tm);tm=setTimeout(make,300);}
['input','keyup','change','paste'].forEach(function(e){txt.addEventListener(e,later);});
$('go').onclick=make;
$('cl').onclick=function(){txt.value='';none();say('');txt.focus();};
$('pa').onclick=function(){
if(navigator.clipboard&&navigator.clipboard.readText){
navigator.clipboard.readText().then(function(v){txt.value=v;make();}).catch(function(){say('اجازه‌ی چسباندن داده نشد. داخل کادر نگه دار و Paste را بزن.',1);});
}else say('داخل کادر نگه دار و Paste را بزن.',1);
};
function save(b,name){
var u=URL.createObjectURL(b),a=document.createElement('a');
a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
setTimeout(function(){URL.revokeObjectURL(u);},2000);
}
dl.onclick=function(){
